name: Deploy Optimasi WA

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy ke VPS
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e

            cd ~/dev/optimasi-wa

            echo "==> Update source dari GitHub"
            git fetch origin main
            git reset --hard origin/main

            echo "==> Sinkronisasi ke project Arcane"
            sudo cp Dockerfile compose.yaml index.html \
              /var/lib/docker/volumes/arcane_arcane-data/_data/projects/optimasi-wa/

            echo "==> Build dan restart container"
            sudo docker compose \
              -f /var/lib/docker/volumes/arcane_arcane-data/_data/projects/optimasi-wa/compose.yaml \
              up -d --build

            echo "==> Status container"
            sudo docker ps --filter name=optimasi-wa
